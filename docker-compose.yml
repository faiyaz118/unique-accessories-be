services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: unique_accessories
      POSTGRES_PASSWORD: dev_local_only_pw
      POSTGRES_DB: unique_accessories_dev
    ports:
      - "5432:5432"
    volumes:
      - unique_accessories_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unique_accessories -d unique_accessories_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  unique_accessories_pg:
